{% extends "admin/admin_base.html" %}

{% block admin_content %}

<form method="POST" action="/admin/categories/add" class="auth-form">
    <label for="name">Category Name</label>

    <button type="submit" class="cta-button">Add Category</button>
</form>
{% endblock %}
