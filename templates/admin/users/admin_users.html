{% extends "admin/admin_base.html" %}

{% block admin_content %}
<h2>Manage Users</h2>

<table class="admin-table">
    <thead>
        <tr>
            <th>ID</th>
            <TH>Username</TH>
            <th>Email</th>
            <th>is_admin</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
                <form method="POST" action="/admin/users/toggle-admin/{{ user.id }}">
                    <input type="checkbox" onchange="this.form.submit()" {% if user.is_admin %}checked{% endif %} {% if user.id == g.user_id %}disabled{% endif %}>
                </form>
            </td>
            <td>
                {% if user.is_active %}
                    <span class="status-badge status-active">Active</span> — <a href="/admin/user/toggle-status/{{ user.id }}">Disable</a>
                {% else %}
                    <span class="status-badge status-disabled">Disabled</span> — <a href="/admin/user/toggle-status/{{ user.id }}">Enable</a>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
